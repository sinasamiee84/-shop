{% extends "base.html" %}
{% block content %}
<div class="shop-page container py-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 text-dark fw-bold m-0">جدیدترین محصولات</h2>
        <a href="{% url 'products:list' %}" class="btn btn-sm btn-outline-success">مشاهده همه</a>
    </div>

    <div class="row row-cols-2 row-cols-md-4 g-3">
        {% for product in recent_products %}
            <div class="col">{% include "products/_product_card.html" %}</div>
        {% empty %}
            <div class="col-12 text-center py-5 text-muted">محصولی برای نمایش وجود ندارد.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
